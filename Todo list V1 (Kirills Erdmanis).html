<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Todo List V3</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .done { text-decoration: line-through; color: gray; }
        .cursor-pointer { cursor: pointer; }
    </style>
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-body">
            <h3 class="text-center mb-4">Todo List V3</h3>

            <div class="input-group mb-3">
                <select id="priority" class="form-select" style="max-width:150px;">
                    <option value="SVARĪGI!">SVARĪGI!</option>
                    <option value="Vidējs" selected>Vidējs</option>
                    <option value="Zema">Zema</option>
                </select>
                <input type="text" id="taskInput" class="form-control" placeholder="Ieraksti darbu...">
                <button class="btn btn-primary" onclick="addTask()">Pievienot</button>
            </div>

            <div class="row mb-3 g-2">
                <div class="col-md-6">
                    <input type="text" id="searchInput" class="form-control" placeholder="Meklēt uzdevumu..." oninput="renderTasks()">
                </div>
                <div class="col-md-6 text-md-end">
                    <div class="btn-group w-100" role="group">
                        <button type="button" class="btn btn-outline-secondary active" onclick="setFilter('all', this)">Visi</button>
                        <button type="button" class="btn btn-outline-secondary" onclick="setFilter('active', this)">Aktīvie</button>
                        <button type="button" class="btn btn-outline-secondary" onclick="setFilter('completed', this)">Pabeigtie</button>
                    </div>
                </div>
            </div>

            <ul id="list" class="list-group mb-3"></ul>

            <div class="d-flex justify-content-between align-items-center border-top pt-3">
                <span id="itemsLeft">Atlikuši 0 darbi</span>
                <button class="btn btn-link text-danger text-decoration-none" onclick="clearCompleted()">Notīrīt pabeigtos</button>
            </div>
        </div>
    </div>
</div>

<script>
    let tasks = JSON.parse(localStorage.getItem("tasksV3")) || [];
    let currentFilter = 'all';

    function save() {
        localStorage.setItem("tasksV3", JSON.stringify(tasks));
        renderTasks();
    }

    function addTask() {
        const text = document.getElementById("taskInput").value.trim();
        const priority = document.getElementById("priority").value;
        
        if (text === "") return;

        tasks.push({
            id: Date.now(),
            text: text,
            priority: priority,
            completed: false
        });

        document.getElementById("taskInput").value = "";
        save();
    }

    function toggleDone(id) {
        tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
        save();
    }

    function removeTask(id) {
        tasks = tasks.filter(t => t.id !== id);
        save();
    }

    function clearCompleted() {
        tasks = tasks.filter(t => !t.completed);
        save();
    }

    function setFilter(filter, btn) {
        currentFilter = filter;
        document.querySelectorAll('.btn-group .btn').forEach(b => b.classList.remove('active', 'btn-secondary'));
        document.querySelectorAll('.btn-group .btn').forEach(b => b.classList.add('btn-outline-secondary'));
        btn.classList.add('active', 'btn-secondary');
        btn.classList.remove('btn-outline-secondary');
        renderTasks();
    }

    function editTask(id) {
        const task = tasks.find(t => t.id === id);
        const newText = prompt("Labot uzdevumu:", task.text);
        if (newText !== null && newText.trim() !== "") {
            task.text = newText.trim();
            save();
        }
    }

    function renderTasks() {
        const list = document.getElementById("list");
        const searchText = document.getElementById("searchInput").value.toLowerCase();
        list.innerHTML = "";

        let filteredTasks = tasks.filter(t => {
            const matchesSearch = t.text.toLowerCase().includes(searchText);
            if (currentFilter === 'active') return !t.completed && matchesSearch;
            if (currentFilter === 'completed') return t.completed && matchesSearch;
            return matchesSearch;
        });

        filteredTasks.forEach(t => {
            const color = t.priority === "SVARĪGI!" ? "danger" : (t.priority === "Zema" ? "success" : "warning");
            const li = document.createElement("li");
            li.className = "list-group-item d-flex justify-content-between align-items-center";
            
            li.innerHTML = `
                <div style="flex:1" class="d-flex align-items-center">
                    <span class="badge bg-${color} me-2">${t.priority}</span>
                    <span class="cursor-pointer ${t.completed ? 'done' : ''}" onclick="toggleDone(${t.id})">${t.text}</span>
                </div>
                <div>
                    <button class="btn btn-outline-info btn-sm me-1" onclick="editTask(${t.id})">Labot</button>
                    <button class="btn btn-outline-danger btn-sm" onclick="removeTask(${t.id})">Dzēst</button>
                </div>
            `;
            list.appendChild(li);
        });

        const leftCount = tasks.filter(t => !t.completed).length;
        document.getElementById("itemsLeft").innerText = `Atlikuši ${leftCount} darbi`;
    }

    renderTasks();
</script>

</body>
</html>
