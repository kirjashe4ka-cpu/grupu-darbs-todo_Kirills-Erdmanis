<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mani darbi</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
.done{
  text-decoration: line-through;
  color: gray;
}
</style>

</head>

<body class="bg-light">

<div class="container mt-5">
<div class="card shadow">
<div class="card-body">

<h3 class="text-center mb-4">Mani darbi</h3>

<div class="input-group mb-3">

<select id="priority" class="form-select" style="max-width:150px;">
<option value="SVARĪGI!">SVARĪGI!</option>
<option value="Vidējs" selected>Vidējs</option>
<option value="Zema">Zema</option>
</select>

<input type="text" id="task" class="form-control" placeholder="Ievadiet darbu..">

<button class="btn btn-primary" onclick="addTask()">Pievienot</button>

</div>

<ul id="list" class="list-group"></ul>

</div>
</div>
</div>

<script>

function addTask(){

var text = document.getElementById("task").value;
var priority = document.getElementById("priority").value;

if(text == "") return;

var color = "warning";

if(priority == "SVARĪGI!"){
color = "danger";
}

if(priority == "Zema"){
color = "success";
}

var li = document.createElement("li");

li.className = "list-group-item d-flex justify-content-between align-items-center";

li.innerHTML =
'<span class="badge bg-'+color+' me-2">'+priority+'</span>' +
'<span onclick="done(this)" style="flex:1; cursor:pointer;">'+text+'</span>' +
'<button class="btn btn-danger btn-sm" onclick="removeTask(this)">Dzēst</button>';

document.getElementById("list").appendChild(li);

document.getElementById("task").value="";

}

function done(el){
el.classList.toggle("done");
}

function removeTask(btn){
btn.parentElement.remove();
}

</script>

</body>
</html>
